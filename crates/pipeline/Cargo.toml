[package]
name = "switchscribe-pipeline"
description = "switchscribe pipeline: VAD, transcription, diarization, track merge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["whisper"]
# whisper.cpp through whisper-rs (CPU). Off for quick builds that only need the traits.
whisper = ["dep:whisper-rs"]
# GPU backends for whisper.cpp; each needs its SDK at build time.
vulkan = ["whisper", "whisper-rs/vulkan"]
cuda = ["whisper", "whisper-rs/cuda"]

[dependencies]
switchscribe-capture.workspace = true
switchscribe-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq.workspace = true
whisper-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
