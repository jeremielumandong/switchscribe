name: Release

# Builds the Windows installer, signs it when signing secrets exist, and publishes a
# GitHub release with the installer and its .sha256 sidecar (what the in-app update
# checker in crates/integrations/src/update.rs reads). See installer/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match Cargo.toml)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version matches Cargo.toml
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION.Trim().TrimStart('v')
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Output "::error::'$version' is not X.Y.Z (the installer and the update checker need a plain version)"
            exit 1
          }
          # The version under [workspace.package] in the root Cargo.toml.
          $toml = Get-Content Cargo.toml -Raw
          $section = [regex]::Match($toml, '(?ms)^\[workspace\.package\]\s*$(.*?)(?=^\[|\z)')
          $cargo = [regex]::Match($section.Groups[1].Value, '(?m)^\s*version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($cargo -ne $version) {
            Write-Output "::error file=Cargo.toml::Release version $version does not match [workspace.package] version '$cargo'. Bump Cargo.toml, commit, and tag v<version>."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Output "Releasing switchscribe $version"

      - name: Signing method
        id: signing
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TS_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
        run: |
          if ($env:CERT_PFX -and $env:CERT_PASSWORD) {
            $method = 'pfx'
          } elseif ($env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and $env:TS_ENDPOINT -and $env:TS_ACCOUNT -and $env:TS_PROFILE) {
            $method = 'azure'
          } else {
            $method = 'none'
            Write-Output "::warning::No signing secrets: building an UNSIGNED installer. Windows SmartScreen will warn users. Set WINDOWS_CERT_PFX + WINDOWS_CERT_PASSWORD, or the Azure Trusted Signing secrets and variables (installer/README.md)."
          }
          "method=$method" >> $env:GITHUB_OUTPUT
          Write-Output "Signing: $method"

      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build
        run: cargo build --release --locked -p switchscribe-app

      - name: Stage dist
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\switchscribe.exe dist\
          # sherpa-onnx's shared libraries (and anything else the build copied next to
          # the exe) must ship beside it.
          Get-ChildItem target\release -Filter *.dll -File | Copy-Item -Destination dist\
          Get-ChildItem dist | Format-Table Name, Length

      - name: Locate signtool
        if: steps.signing.outputs.method == 'pfx'
        id: signtool
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $tool = Get-ChildItem $kits -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' -and $_.Directory.Parent.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $tool) {
            $tool = Get-Command signtool.exe -ErrorAction SilentlyContinue | ForEach-Object { Get-Item $_.Source }
          }
          if (-not $tool) {
            Write-Output "::error::signtool.exe not found under $kits"
            exit 1
          }
          Write-Output "signtool: $($tool.FullName)"
          "path=$($tool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Decode certificate
        if: steps.signing.outputs.method == 'pfx'
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'switchscribe-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:CERT_PFX -replace '\s', '')))

      - name: Sign the app (certificate)
        if: steps.signing.outputs.method == 'pfx'
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          SIGNTOOL: ${{ steps.signtool.outputs.path }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'switchscribe-signing.pfx'
          & $env:SIGNTOOL sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d switchscribe dist\switchscribe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign the app (Azure Trusted Signing)
        if: steps.signing.outputs.method == 'azure'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Output "::error::ISCC.exe not found after installing Inno Setup"
            exit 1
          }
          $dist = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$dist" "/Oout" installer\switchscribe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "out\switchscribe-setup-$env:VERSION-x64.exe"
          if (-not (Test-Path $installer)) {
            Write-Output "::error::$installer was not produced"
            exit 1
          }

      - name: Sign the installer (certificate)
        if: steps.signing.outputs.method == 'pfx'
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          SIGNTOOL: ${{ steps.signtool.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'switchscribe-signing.pfx'
          & $env:SIGNTOOL sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "switchscribe setup" "out\switchscribe-setup-$env:VERSION-x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign the installer (Azure Trusted Signing)
        if: steps.signing.outputs.method == 'azure'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Remove the certificate
        if: always() && steps.signing.outputs.method == 'pfx'
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'switchscribe-signing.pfx') -Force -ErrorAction SilentlyContinue

      - name: Checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # After signing: the hash covers the file users download.
          $installer = "out\switchscribe-setup-$env:VERSION-x64.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          # Just the hash, no newline or BOM.
          [IO.File]::WriteAllText((Resolve-Path out).Path + "\switchscribe-setup-$env:VERSION-x64.exe.sha256", $hash)
          Write-Output "SHA-256 $hash"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: switchscribe ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/switchscribe-setup-${{ steps.version.outputs.version }}-x64.exe
            out/switchscribe-setup-${{ steps.version.outputs.version }}-x64.exe.sha256
