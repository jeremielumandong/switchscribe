name: Windows release package

on:
  workflow_dispatch:
    inputs:
      upload_unsigned:
        description: Upload the installer to the draft release even when it is not signed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Shared with Linux and macOS: serialize draft creation and asset uploads.
  group: shared-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 120
    environment: windows-release
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      AZURE_CODESIGNING_ENDPOINT: ${{ vars.AZURE_CODESIGNING_ENDPOINT }}
      AZURE_CODESIGNING_ACCOUNT: ${{ vars.AZURE_CODESIGNING_ACCOUNT }}
      AZURE_CODESIGNING_PROFILE: ${{ vars.AZURE_CODESIGNING_PROFILE }}
      SWITCHSCRIBE_SIGN_EXPECTED_SUBJECT: ${{ vars.SWITCHSCRIBE_SIGN_EXPECTED_SUBJECT }}
      SWITCHSCRIBE_SIGN_AZURE_CLI_ONLY: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require passing CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $response = gh api "repos/$env:REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&branch=main&event=push&per_page=1"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read CI status.' }
          $runs = ($response | ConvertFrom-Json).workflow_runs
          if ($runs.Count -eq 0 -or $runs[0].conclusion -ne 'success') {
            throw 'Release blocked: the latest main-branch CI run for this commit must pass first.'
          }
      - name: Check shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/upload-release-assets.py windows --check
          if ($LASTEXITCODE -ne 0) { throw 'Release preflight failed.' }
      # Signing runs only when every setting is present; otherwise the installer is unsigned.
      - name: Detect signing settings
        id: signing
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'AZURE_CODESIGNING_ENDPOINT', 'AZURE_CODESIGNING_ACCOUNT',
            'AZURE_CODESIGNING_PROFILE', 'SWITCHSCRIBE_SIGN_EXPECTED_SUBJECT')
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -eq 0) {
            'enabled=true' >> $env:GITHUB_OUTPUT
            Write-Host 'Signing enabled.'
          } else {
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Building an unsigned installer; missing windows-release variables: $($missing -join ', ')"
          }
      - name: Check signing prerequisites
        if: steps.signing.outputs.enabled == 'true'
        run: |
          if ($env:SWITCHSCRIBE_SIGN_EXPECTED_SUBJECT.StartsWith("'") -or $env:SWITCHSCRIBE_SIGN_EXPECTED_SUBJECT.StartsWith('"')) {
            throw 'Enter the expected subject without surrounding quotes in GitHub.'
          }
          $runtimes = dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0 -or -not ($runtimes -match '^Microsoft.NETCore.App 8\.')) {
            throw 'The signing client requires the x64 .NET 8 runtime.'
          }
          . ./packaging/windows/trusted-signing.ps1
          $context = New-TrustedSigningContext
          "SWITCHSCRIBE_SIGN_DLIB=$($context.Dlib)" >> $env:GITHUB_ENV
          "SWITCHSCRIBE_SIGN_SIGNTOOL=$($context.SignTool)" >> $env:GITHUB_ENV
      # Chocolatey can exit 0 having installed nothing (a 504 from its feed: "installed 0/0
      # packages"), so check for ISCC after each attempt, retry, fall back to winget, and
      # fail here rather than after the long build.
      - name: Inno Setup
        run: |
          function Find-Iscc {
            @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $iscc = Find-Iscc
          for ($attempt = 1; -not $iscc -and $attempt -le 3; $attempt++) {
            Write-Host "Installing Inno Setup with Chocolatey (attempt $attempt of 3)"
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
            if (-not $iscc -and $attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          if (-not $iscc) {
            Write-Host 'Chocolatey did not install Inno Setup; trying winget'
            winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'Inno Setup installation failed: ISCC.exe not found.' }
          Write-Host "ISCC: $iscc"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-windows-release
          cache-on-failure: true
      # The cache keeps target/ but not sherpa-onnx's downloaded libraries, so a restored
      # build looks finished and then fails to link. Make its build script fetch them again.
      - name: Refetch sherpa-onnx libraries
        shell: bash
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          # Release builds pass --target, so its build output is under target/<triple>/.
          if [ -d target ]; then find target -type d -name 'sherpa-onnx-sys-*' -prune -exec rm -rf {} +; fi
      # Without signing this also writes the unsigned installer.
      - name: Compile the release executable
        run: ./packaging/windows/build-windows.ps1
      # Sign in after compiling and don't rebuild afterwards: the GitHub OIDC assertion can
      # expire before SignTool exchanges it for a signing token.
      - name: Sign in to Azure with OIDC
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Package, sign, and verify the Windows installer
        if: steps.signing.outputs.enabled == 'true'
        run: ./packaging/windows/build-windows.ps1 -Sign -SkipBuild
      - name: Write installer checksum
        run: |
          $installers = @(Get-ChildItem dist/switchscribe-setup-*-x64.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          }
      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: switchscribe-windows-x64-${{ steps.signing.outputs.enabled == 'true' && 'signed' || 'unsigned' }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/switchscribe-setup-*-x64.exe
            dist/switchscribe-setup-*-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload Windows assets to shared draft release
        if: steps.signing.outputs.enabled == 'true' || inputs.upload_unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/upload-release-assets.py windows
          if ($LASTEXITCODE -ne 0) { throw 'Uploading Windows release assets failed.' }
