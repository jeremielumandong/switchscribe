<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- switchscribe app icon: a record button beside the lines of a transcript.
       Source of truth for 48 px and up; generate.py renders the PNG / ICO / ICNS set from
       this file and from switchscribe-small.svg (16-32 px). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24242B"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="url(#rim)" stroke-width="12"/>
  <!-- On a 48-unit grid, scaled to the tile. -->
  <g transform="translate(176 176) scale(14)" stroke-linecap="round">
    <circle cx="13" cy="24" r="8" fill="none" stroke="#E4E5E8" stroke-width="3"/>
    <circle cx="13" cy="24" r="4.5" fill="#ED4042"/>
    <g fill="none" stroke-width="4">
      <path d="M28 14h12" stroke="#6ED9D2"/>
      <path d="M28 24h12" stroke="#B9BCC3"/>
      <path d="M28 34h7" stroke="#B9BCC3"/>
    </g>
  </g>
</svg>
